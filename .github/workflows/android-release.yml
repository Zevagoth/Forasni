name: Build & Release Forasni APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing key and environment (Auto-fallback if secrets not set)
        env:
          FORASNI_KEYSTORE_BASE64: ${{ secrets.FORASNI_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.FORASNI_STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.FORASNI_KEY_PASSWORD }}
        run: |
          if [ -n "$FORASNI_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            printf '%s' "$FORASNI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forasni-release.jks"
            echo "FINAL_STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FINAL_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/forasni-release.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "forasni2026" \
              -keypass "forasni2026" \
              -dname "CN=Forasni, OU=Mobile, O=Forasni Jordan, L=Amman, S=Amman, C=JO"
            echo "FINAL_STORE_PASSWORD=forasni2026" >> "$GITHUB_ENV"
            echo "FINAL_KEY_PASSWORD=forasni2026" >> "$GITHUB_ENV"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/forasni-release.jks
          STORE_PASSWORD: ${{ env.FINAL_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.FINAL_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK to Forasni.apk
        run: cp app/build/outputs/apk/release/app-release.apk Forasni.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forasni-Android-APK
          path: Forasni.apk

      - name: Publish GitHub Release Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-preview.1
          name: "📲 Forasni Android Preview (تطبيق فرصني - تحميل مباشر)"
          body: |
            ## 🇯🇴 تطبيق فرصني (Forasni) - نسخة الأندرويد الجاهزة للتثبيت
            اضغط على ملف **`Forasni.apk`** بالأسفل تحت قسم **Assets** لتحميل التطبيق وتثبيته مباشرة على هاتفك.

            ---
            Private Android preview for the repository owner.
            Download `Forasni.apk` from Assets and install it on an Android device.
          files: Forasni.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
