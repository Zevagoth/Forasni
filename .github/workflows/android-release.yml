name: Build & Release Forasni APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing key and environment
        env:
          FORASNI_KEYSTORE_BASE64: ${{ secrets.FORASNI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FORASNI_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FORASNI_KEY_PASSWORD }}
        run: |
          test -n "$FORASNI_KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$FORASNI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forasni-release.jks"
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/forasni-release.jks
          STORE_PASSWORD: ${{ secrets.FORASNI_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FORASNI_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK to Forasni.apk
        run: cp app/build/outputs/apk/release/app-release.apk Forasni.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forasni-Android-APK
          path: Forasni.apk

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Forasni Android Preview"
          body: |
            Private Android preview for the repository owner.

            Download `Forasni.apk` from Assets and install it on an Android device.
            The guest preview uses local sample data. Google Sign-In and cloud
            synchronization require Firebase configuration and are unavailable
            in this build.
          files: Forasni.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
